<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Column Battler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="backdrop" id="popup" hidden>
        <div class="dialogue">
            <!-- Close button -->
            <button class="close" id="close">X</button>
            <p class="font" id="description"></p>
            
            <div class="buttonsatthebottom">
                <button class="buttondesign" id="back" onclick="back()">Back</button>
                <button class="buttondesign" id="next" onclick="next()">Next</button>
            </div>
        </div>
    </div>

    <!-- Game layout -->
    <div class="cardsgrid">
        <div id="redcardone"></div>
        <div id="redcardtwo"></div>
        <div id="redcardthree"></div>
        <div id="redcardfour"></div>
        <div id="redcardfive"></div>
        <div id="redcardsix"></div>
        <br>
        <div id="columnone"></div>
        <div id="columntwo"></div>
        <div id="columnthree"></div>
        <div id="columnfour"></div>
        <div id="columnfive"></div>
        <div id="columnsix"></div>
        <br>
        <div id="bluecardone"></div>
        <div id="bluecardtwo"></div>
        <div id="bluecardthree"></div>
        <div id="bluecardfour"></div>
        <div id="bluecardfive"></div>
        <div id="bluecardsix"></div>
        <br>
        <div id="bluedeploydone"></div>
        <div id="bluedeploytwo"></div>
        <div id="bluedeploythree"></div>
        <div id="bluedeployfour"></div>
        <div id="bluedeployfive"></div>
        <div id="bluedeploysix"></div>
    </div>

    <script src="script.js"></script>
    <script>
        const popup = document.querySelector("#popup");
        popup.hidden = false;
        document.querySelector("#close").onclick = () => popup.hidden = true;
        let step = 0;
        description.innerHTML=intro[0];

        function back() {
            if(step != 0) {
                step--;
            }
            description.innerHTML = intro[step];
        }
        
        function next() {
            if(step == intro.length - 1) {
                popup.hidden = true;
            } else {
                step++;
                description.innerHTML = intro[step];
            }
        }
    </script>
</body>
</html>
