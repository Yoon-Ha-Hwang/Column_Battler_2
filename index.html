<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Column Battler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="backdrop" id="popup" hidden>
        <div class="dialogue">
            <!-- Close button -->
            <button class="close" id="close">X</button>
            <h2 class="font">Welcome to Column Battler!</h2>
            <p class="font" id="description"></p>
            <button class="buttondesign" id="back" onclick="back()">Back</button>
            <button class="buttondesign" id="next" onclick="next()">Next</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const popup = document.querySelector("#popup");
        popup.hidden = false;
        document.querySelector("#close").onclick = () => popup.hidden = true;
        let step = 0;
        description.textContent=intro[0];

        function back() {
            if(step != 0) {
                step--;
            }
            description.textContent = intro[step];
        }
        
        function next() {
            if(step == intro.length - 1) {
                popup.hidden = true;
            } else {
                step++;
                description.textContent = intro[step];
            }
        }
    </script>
</body>
</html>
