<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Column Battler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="backdrop" id="popup" hidden>
        <div class="dialogue">
            <!-- Close button -->
            <button class="close" id="close">X</button>
            <p class="font" id="description"></p>
            
            <div class="buttonsatthebottom">
                <button class="buttondesign" id="back" onclick="back()">Back</button>
                <button class="buttondesign" id="next" onclick="next()">Next</button>
            </div>
        </div>
    </div>

    <!-- Game layout -->
    <div class="cardsgrid">
        <div class="redcard" id="rc1"></div>
        <div class="redcard" id="rc2"></div>
        <div class="redcard" id="rc3"></div>
        <div class="redcard" id="rc4"></div>
        <div class="redcard" id="rc5"></div>
        <div class="redcard" id="rc6"></div>
        <br>
        <div class="columnsign" id="col1"></div>
        <div class="columnsign" id="col2"></div>
        <div class="columnsign" id="col3"></div>
        <div class="columnsign" id="col4"></div>
        <div class="columnsign" id="col5"></div>
        <div class="columnsign" id="col6"></div>
        <br>
        <div class="bluecard" id="bc1"></div>
        <div class="bluecard" id="bc2"></div>
        <div class="bluecard" id="bc3"></div>
        <div class="bluecard" id="bc4"></div>
        <div class="bluecard" id="bc5"></div>
        <div class="bluecard" id="bc6"></div>
        <br>
        <!-- "Blue Deploy"-->
        <div class="bluebutton" id="bd1"></div>
        <div class="bluebutton" id="bd2"></div>
        <div class="bluebutton" id="bd3"></div>
        <div class="bluebutton" id="bd4"></div>
        <div class="bluebutton" id="bd5"></div>
        <div class="bluebutton" id="bd6"></div>
    </div>

    <script src="script.js"></script>
    <script>
        const popup = document.querySelector("#popup");
        popup.hidden = false;
        document.querySelector("#close").onclick = () => popup.hidden = true;
        let step = 0;
        description.innerHTML=intro[0];

        function back() {
            if(step != 0) {
                step--;
            }
            description.innerHTML = intro[step];
        }
        
        function next() {
            if(step == intro.length - 1) {
                popup.hidden = true;
            } else {
                step++;
                description.innerHTML = intro[step];
            }
        }
    </script>
</body>
</html>
